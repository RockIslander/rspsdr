<?xml version="1.0" encoding="UTF-8"?>
<!-- The RSPSDR mark. This is the same shape rspsdr/logo.py paints, kept here
     in vector form for the desktop environment (menu entry, file manager). -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153f66"/>
      <stop offset="0.55" stop-color="#0d1b2c"/>
      <stop offset="1" stop-color="#090b0f"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="14"
        fill="url(#badge)" stroke="#3f88ad" stroke-width="2"/>

  <!-- mast and waves -->
  <g fill="none" stroke="#7fe7ff" stroke-linecap="round">
    <path d="M32 20 L32 40" stroke-width="2.4"/>
    <!-- each wave is the same 32..148 degree sweep logo.py draws -->
    <path d="M24.79 35.50 A 8.5 8.5 0 0 1 39.21 35.50" stroke-width="2.6"/>
    <path d="M19.70 32.32 A 14.5 14.5 0 0 1 44.30 32.32" stroke-width="2.2"/>
    <path d="M14.62 29.14 A 20.5 20.5 0 0 1 49.38 29.14" stroke-width="1.8"/>
  </g>

  <!-- transmitter -->
  <circle cx="32" cy="40" r="3.4" fill="#ffd166"/>
</svg>
